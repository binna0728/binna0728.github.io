<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON BEAT</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050611;color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;touch-action:none}#a{height:100%;max-width:760px;margin:auto;padding:8px;display:grid;grid-template-rows:54px 1fr 66px;gap:8px}.top{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:7px 12px;border:1px solid #ffffff20;border-radius:15px;background:#0d1022cc}.m small,.song small{display:block;color:#aab0ca;font-size:10px}.m b{font-size:20px}.song{text-align:center}.song b{font-size:12px}.r{text-align:right}#w{position:relative;overflow:hidden;border-radius:18px;border:1px solid #ffffff22;background:#070917}canvas{width:100%;height:100%;display:block}#j{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(28px,8vw,54px);font-weight:1000;opacity:0;text-shadow:0 0 18px currentColor}#ov{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:#03040dcc;backdrop-filter:blur(8px);padding:18px}.card{width:min(440px,94%);padding:24px;border-radius:24px;background:#11152eee;border:1px solid #ffffff22;text-align:center}.logo{font-size:46px;font-weight:1000;line-height:.9;margin-bottom:14px;background:linear-gradient(90deg,#ff4fa3,#7c5cff,#34d6ff,#40f0a8);color:transparent;background-clip:text}.card p{color:#b8bfd8;font-size:13px;line-height:1.65}.ds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:15px 0}.d{border:1px solid #ffffff22;background:#ffffff08;color:#cbd0e8;padding:10px 3px;border-radius:12px;font-weight:800}.d.on{color:#fff;background:#7368ff55;border-color:#ffffff66}.go,.sub{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px}.go{background:linear-gradient(90deg,#ff75bf,#8b78ff,#49dbff,#57efb5);color:#07101a}.sub{margin-top:8px;background:#ffffff0c;color:#fff;border:1px solid #ffffff22}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.k{border:1px solid #ffffff22;background:#101329;color:#fff;border-radius:15px;font-size:22px;font-weight:1000}.k.on{transform:translateY(2px);filter:brightness(1.8)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%,65%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}@media(max-width:520px){.ds{grid-template-columns:repeat(2,1fr)}#a{grid-template-rows:50px 1fr 62px}}</style><div id="a"><div class="top"><div class="m"><small>SCORE</small><b id="sc">000000</b></div><div class="song"><b id="st">RANDOM TRACK</b><small id="si">매 게임 새로운 곡</small></div><div class="m r"><small>COMBO</small><b id="co">0</b></div></div><div id="w"><canvas id="c"></canvas><div id="j">PERFECT</div><div id="ov"><div class="card" id="card"></div></div></div><div class="keys"><button class="k" data-l="0">D</button><button class="k" data-l="1">F</button><button class="k" data-l="2">J</button><button class="k" data-l="3">K</button></div></div><script>(()=>{const C=document.querySelector('#c'),x=C.getContext('2d'),W=document.querySelector('#w'),O=document.querySelector('#ov'),card=document.querySelector('#card'),SC=document.querySelector('#sc'),CO=document.querySelector('#co'),J=document.querySelector('#j'),KS=[...document.querySelectorAll('.k')],LC=['#ff4fa3','#7c5cff','#34d6ff','#40f0a8'],KM={KeyD:0,KeyF:1,KeyJ:2,KeyK:3};let ww=1,hh=1,dpr=1,run=0,raf=0,A,M,as=0,beat=.46,song,n=[],score=0,combo=0,max=0,p=0,g=0,m=0,last=-1,d='normal',lf=0;const D={easy:['쉬움',2.25,.12,.25,.28,.78,0,.85],normal:['보통',1.85,.09,.20,.23,1,.04,1],hard:['어려움',1.55,.075,.17,.20,1,.15,1.2],extreme:['극한',1.3,.06,.14,.17,1,.28,1.5]},S=[['NEON RUSH',128,'Synthwave','#29113f','#060711','#ff4fa3','#7c5cff'],['MIDNIGHT DRIVE',112,'Night Pop','#071a34','#02060f','#3f8cff','#34d6ff'],['PIXEL STORM',140,'Chiptune','#35210a','#11060a','#ff8f3d','#ffd761'],['AURORA BOUNCE',124,'Future Pop','#09252c','#041012','#40f0a8','#34d6ff'],['HYPER CIRCUIT',150,'Electro','#230913','#090409','#ff4667','#ff8f3d']];function R(){dpr=Math.min(2,devicePixelRatio||1);ww=W.clientWidth;hh=W.clientHeight;C.width=ww*dpr;C.height=hh*dpr;x.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(R).observe(W);R();function menu(){card.innerHTML=`<div class="logo">NEON<br>BEAT</div><p>곡은 게임마다 랜덤으로 바뀝니다.<br>노트가 판정선에 닿을 때 누르세요.<br>PC D F J K · 모바일 아래 버튼 터치</p><div class="ds">${Object.keys(D).map(k=>`<button class="d ${k==d?'on':''}" data-d="${k}">${D[k][0]}</button>`).join('')}</div><button class="go" id="go">${D[d][0]}으로 시작</button>`;card.querySelectorAll('.d').forEach(b=>b.onclick=()=>{d=b.dataset.d;menu()});card.querySelector('#go').onclick=start}function pick(){let q;do q=Math.floor(Math.random()*S.length);while(q==last);last=q;song=S[q];beat=60/song[1];document.querySelector('#st').textContent=song[0];document.querySelector('#si').textContent=`${song[2]} · ${song[1]} BPM`}function chart(){n=[];let t=0,i=0;const pat=[[0,1,2,3],[0,2,1,3],[3,1,2,0],[0,1,3,2]];while(t<52){for(let z=0;z<4;z++){if(Math.random()<=D[d][5]){let l=(pat[i%4][z]+i)%4,tt=t+z*beat;n.push({l,t:tt,h:0});if(Math.random()<D[d][6])n.push({l:(l+2)%4,t:tt,h:0})}}t+=4*beat;i++}n.sort((a,b)=>a.t-b.t)}function setup(){A=new(AudioContext||webkitAudioContext);M=A.createGain();M.gain.value=.16;M.connect(A.destination)}function tone(t,f,du=.1,type='sine',v=.18){let o=A.createOscillator(),q=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(q);q.connect(M);o.start(t);o.stop(t+du+.02)}function music(){let b=[110,130.81,146.83,98],l=[440,523.25,659.25,587.33],N=Math.ceil(54/beat);for(let i=0;i<N;i++){let t=as+i*beat;tone(t,b[(i>>1)%4],beat*.38,'triangle',.14);tone(t+beat*.5,7000,.025,'square',.015);if(i%2==0)tone(t,l[(i>>1)%4],beat*.28,'square',.05);if(i%4==0)tone(t,70,.12,'sine',.28)}}async function start(){cancelAnimationFrame(raf);pick();chart();score=combo=max=p=g=m=0;SC.textContent='000000';CO.textContent='0';if(A)await A.close().catch(()=>{});setup();await A.resume();as=A.currentTime+D[d][1]+.35;music();O.style.display='none';run=1;lf=performance.now()/1e3;raf=requestAnimationFrame(loop)}function now(){return A?A.currentTime-as:-2}function judge(t,c){J.textContent=t;J.style.color=c;J.style.animation='none';void J.offsetWidth;J.style.animation='pop .52s ease-out'}function hit(l){if(!run)return;KS[l].classList.add('on');setTimeout(()=>KS[l].classList.remove('on'),80);let t=now(),best=null,bd=9;for(let a of n){if(a.h||a.l!=l)continue;let z=Math.abs(t-a.t);if(z<bd){best=a;bd=z}if(a.t>t+D[d][3]+.05)break}if(best&&bd<=D[d][3]){best.h=1;if(bd<=D[d][2]){p++;score+=Math.round((1000+combo*8)*D[d][7]);judge('PERFECT','#ffd761')}else{g++;score+=Math.round((550+combo*5)*D[d][7]);judge('GOOD','#7fe8ff')}combo++;max=Math.max(max,combo);SC.textContent=String(score).padStart(6,'0');CO.textContent=combo;tone(A.currentTime,[262,330,392,523][l],.07,'sine',.12)}}function bg(t){let G=x.createLinearGradient(0,0,0,hh);G.addColorStop(0,song?song[3]:'#0d1230');G.addColorStop(1,song?song[4]:'#050711');x.fillStyle=G;x.fillRect(0,0,ww,hh);if(song){for(let q=0;q<2;q++){let cx=q?ww*.8:ww*.2,cy=q?hh*.65:hh*.2,rg=x.createRadialGradient(cx+Math.sin(t*.4+q)*30,cy,1,cx,cy,ww*.48);rg.addColorStop(0,(q?song[6]:song[5])+'55');rg.addColorStop(1,'transparent');x.fillStyle=rg;x.fillRect(0,0,ww,hh)}}for(let i=0;i<28;i++){x.globalAlpha=.25;x.fillStyle='#fff';x.fillRect((i*91+Math.sin(t+i)*12)%ww,((i*57+t*24*(i%3+1))%(hh+50))-25,1.5,1.5)}x.globalAlpha=1;let lw=ww/4;for(let i=0;i<4;i++){x.fillStyle=i%2?'#ffffff06':'#ffffff02';x.fillRect(i*lw,0,lw,hh);if(i){x.strokeStyle='#ffffff17';x.beginPath();x.moveTo(i*lw,0);x.lineTo(i*lw,hh);x.stroke()}}let y=hh-72;x.strokeStyle='#ffffffdd';x.lineWidth=3;x.shadowBlur=16;x.shadowColor='#fff';x.beginPath();x.moveTo(0,y);x.lineTo(ww,y);x.stroke();x.shadowBlur=0}function note(a,t){let dt=a.t-t,y=-24+(1-dt/D[d][1])*(hh-48),lw=ww/4,pad=10;if(y<-40||y>hh)return;x.save();x.fillStyle=LC[a.l];x.shadowBlur=18;x.shadowColor=LC[a.l];x.fillRect(a.l*lw+pad,y-10,lw-pad*2,20);x.restore()}function end(){run=0;let T=p+g+m,acc=T?((p+g*.6)/T*100):0,gr=acc>=95?'S':acc>=88?'A':acc>=75?'B':acc>=60?'C':'D';O.innerHTML=`<div class="card"><div class="logo">RESULT</div><p><b>${song[0]}</b> · ${D[d][0]}<br>최고 콤보 ${max}</p><p>점수 <b>${score}</b> · 등급 <b>${gr}</b><br>PERFECT ${p} / GOOD ${g} / MISS ${m}<br>정확도 ${acc.toFixed(1)}%</p><button class="go" id="again">새 노래</button><button class="sub" id="chg">난이도 변경</button></div>`;O.style.display='grid';document.querySelector('#again').onclick=start;document.querySelector('#chg').onclick=()=>{O.innerHTML='<div class="card" id="card"></div>';window.location.reload()}}function loop(){if(!run)return;let t=now(),q=performance.now()/1e3,dt=Math.min(.033,q-lf);lf=q;bg(t);for(let a of n)if(!a.h&&t-a.t>D[d][4]){a.h=2;m++;combo=0;CO.textContent=0;judge('MISS','#ff6a7d')}for(let a of n)if(!a.h&&a.t-t<=D[d][1]&&a.t-t>-.3)note(a,t);if(t>=54)end();else raf=requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(!e.repeat&&KM[e.code]!=null){e.preventDefault();hit(KM[e.code])}});KS.forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(+b.dataset.l)}));menu()})();</script></html>
